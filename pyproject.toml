[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grim"
version = "0.2.0"
description = "GRIM — security audit MCP: detects security gaps, exposures, and active compromise across any stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AbduljabbarBXR" }]
keywords = ["security", "mcp", "audit", "malware", "sast", "osv", "sbom", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
[project.urls]
Homepage = "https://github.com/AbduljabbarBXR/grim"
Repository = "https://github.com/AbduljabbarBXR/grim"
Issues = "https://github.com/AbduljabbarBXR/grim/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"

[project.scripts]
grim = "grim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
