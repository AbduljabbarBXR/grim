[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grim-mcp"
version = "0.3.0"
description = "Security audit MCP server: finds code, dependency, exposure, secrets, and active-compromise gaps across any stack"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AbduljabbarBXR" }]
keywords = ["security", "mcp", "model-context-protocol", "audit", "malware", "sast", "osv", "sbom", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
[project.urls]
Homepage = "https://github.com/AbduljabbarBXR/grim"
Repository = "https://github.com/AbduljabbarBXR/grim"
Issues = "https://github.com/AbduljabbarBXR/grim/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[project.scripts]
grim = "grim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
