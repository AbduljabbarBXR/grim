[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grim"
version = "0.1.0"
description = "GRIM — security audit MCP: detects security gaps, exposures, and active compromise across any stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AbduljabbarBXR" }]
keywords = ["security", "mcp", "audit", "malware", "sast", "osv"]

[project.scripts]
grim = "grim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
